<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Mato</title>
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="min-h-screen bg-[#fff4f1]">
  <div class="mx-auto flex min-h-screen max-w-6xl items-center justify-center px-5 py-10">
    <div class="grid w-full overflow-hidden rounded-[var(--radius)] bg-white shadow-soft md:grid-cols-2">
      <div class="hidden bg-[var(--color-primary)] p-12 text-white md:block"><a href="/" class="heading-font text-3xl font-bold">mato.</a>
        <div class="mt-32">
          <p class="text-sm font-bold uppercase tracking-widest text-[#ffc5c9]">Welcome back</p>
          <h1 class="heading-font mt-4 text-5xl font-bold leading-tight">Good food is just a sign in away.</h1>
          <p class="mt-6 leading-7 text-white/75">Save your favorite spots, manage your addresses, and never lose track of your next meal.</p>
        </div>
      </div>
      <div class="p-7 sm:p-12"><a href="/" class="heading-font text-3xl font-bold text-[var(--color-primary)] md:hidden">mato.</a>
        <div class="mt-8 md:mt-16">
          <h1 class="heading-font text-3xl font-bold">Welcome back 👋</h1>
          <p class="mt-2 text-sm text-[var(--color-muted)]">Sign in to continue your food journey.</p>
          <form class="mt-8 space-y-5" onsubmit="event.preventDefault(); window.location.href='/restaurants';"><label class="block text-sm font-semibold">Email address<input type="email" required placeholder="you@example.com" class="mt-2 w-full rounded-[var(--radius)] border border-black/10 px-4 py-3 outline-none focus:border-[var(--color-primary)]"></label><label class="block text-sm font-semibold">Password<input type="password" required placeholder="••••••••" class="mt-2 w-full rounded-[var(--radius)] border border-black/10 px-4 py-3 outline-none focus:border-[var(--color-primary)]"></label>
            <div class="flex items-center justify-between text-sm"><label class="flex items-center gap-2 text-[var(--color-muted)]"><input type="checkbox" class="accent-[var(--color-primary)]"> Remember me</label><a href="#" class="font-semibold text-[var(--color-primary)]">Forgot password?</a></div><button class="w-full rounded-[var(--radius)] bg-[var(--color-primary)] py-3.5 font-bold text-white hover:opacity-90">Sign in</button>
          </form>
          <div class="my-7 flex items-center gap-3 text-xs text-[var(--color-muted)]"><span class="h-px flex-1 bg-black/10"></span>OR<span class="h-px flex-1 bg-black/10"></span></div><button class="w-full rounded-[var(--radius)] border border-black/10 py-3 font-semibold">Continue with Google</button>
          <p class="mt-7 text-center text-sm text-[var(--color-muted)]">New to Mato? <a href="#" class="font-bold text-[var(--color-primary)]">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
